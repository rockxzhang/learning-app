<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>张老师随身讲</title>
<style>
:root{
  /* Apple iPad / VisionOS spatial glass (LIGHT) */
  --bg:#F5F5F7; --bg2:#FFFFFF;
  --glass:rgba(255,255,255,.68); --glass2:rgba(255,255,255,.45); --glass3:rgba(255,255,255,.85);
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --fg:#1D1D1F; --mut:rgba(60,60,67,.58);
  --acc:#007AFF; --acc2:#5E5CE6; --ok:#34C759; --warn:#FF9500; --err:#FF3B30;
  --blur:blur(40px) saturate(180%);
  --r:24px; --r2:16px;
  --shadow:0 10px 40px rgba(0,0,0,.10), 0 2px 10px rgba(0,0,0,.05);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:'Inter','-apple-system','BlinkMacSystemFont','SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px;line-height:1.6;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;
}
/* 环境光 Aurora 画布 */
#aura{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:2}
button{cursor:pointer;font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.26)}
::-webkit-scrollbar-track{background:transparent}

/* header: 玻璃工具栏 */
.header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(255,255,255,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:5}
.header h1{
  font-size:18px;letter-spacing:.2px;font-weight:700;
  background:linear-gradient(90deg,#1D1D1F 20%,#007AFF 40%,#1D1D1F 60%);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;
}
@keyframes shine{0%{background-position:200% center}100%{background-position:-200% center}}
.header h1 small{color:var(--mut);font-size:12px;font-weight:400;margin-left:10px;letter-spacing:0}
.spacer{flex:1}
.btn{
  background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;
  padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.1px;
  box-shadow:0 4px 16px rgba(0,122,255,.28);
  transition:transform .25s var(--spring),box-shadow .25s,filter .2s,opacity .2s;
  transform:translateZ(0);
}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px) scale(1.04);box-shadow:0 8px 24px rgba(0,122,255,.35)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--fg);box-shadow:none;backdrop-filter:blur(10px)}
.btn.ghost:hover{background:rgba(255,255,255,.95);border-color:var(--line2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn .ico{vertical-align:middle;margin-right:5px}
.fname{color:var(--mut);font-size:12px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.version{color:var(--mut);font-size:12px}

/* main layout */
.main{flex:1 1 auto;min-height:0;min-width:0;display:grid;grid-template-columns:2fr 3fr;grid-template-rows:minmax(0,1fr);gap:16px;padding:16px;overflow:hidden}
.left{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.right{display:grid;grid-template-rows:1.05fr 1.35fr;min-width:0;min-height:0}
.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;min-height:0;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow);position:relative;
  animation:cardIn .5s var(--spring) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.panel-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut);letter-spacing:.2px;font-weight:600;background:rgba(255,255,255,.35)}
.panel-head .tag{background:rgba(0,122,255,.1);border:1px solid rgba(0,122,255,.35);border-radius:999px;padding:2px 11px;font-size:12px;color:#007AFF;letter-spacing:0;font-weight:500;backdrop-filter:blur(8px)}
.fontctl{margin-left:auto;display:inline-flex;gap:4px}
.mini{background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--fg);border-radius:10px;width:28px;height:26px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s var(--spring)}
.mini:hover{background:#fff;transform:translateY(-1px)}
.mini:disabled{opacity:.4;cursor:not-allowed}
.panel-body{flex:1;overflow:auto;min-height:0}

/* code */
#code{font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:var(--cfs,12.5px);line-height:1.66;padding:0;border-radius:0;color:#1c2333}
.coder{overflow:auto;height:100%;padding:10px 0}
.cl-row{display:flex;min-height:1.5em;border-left:3px solid transparent;transition:background .18s,border-color .18s;padding:0 4px}
.cl-row:nth-child(even){background:rgba(0,0,0,.02)}
.cl-row.active{background:rgba(0,122,255,.1);border-left:3px solid var(--acc);box-shadow:inset 0 0 20px rgba(0,122,255,.05)}
.cl-no{flex:0 0 44px;text-align:right;padding:0 12px 0 0;color:rgba(60,60,67,.4);font-size:calc(var(--cfs,12.5px) - 1px);user-select:none}
.cl{flex:1;white-space:pre;padding-right:13px}
.cl .cm{color:#82906c;font-style:italic}
.cl .kw{color:#B200F0}
.cl .st{color:#007b1e}
.cl .nu{color:#c25e00}
.cl .fn{color:#003bc5}

/* markdown solution */
#solution{padding:18px;font-size:14px;line-height:1.8}
#solution h1,#solution h2,#solution h3{margin:16px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line);color:#1D1D1F;font-weight:700;letter-spacing:.1px}
#solution h1{font-size:19px}#solution h2{font-size:16px}#solution h3{font-size:14px}
#solution p{margin:7px 0}
#solution ul,#solution ol{margin:6px 0 6px 22px}
#solution li{margin:3px 0}
#solution strong{color:#c25e00}
#solution code{background:rgba(0,122,255,.08);border:1px solid rgba(0,122,255,.25);padding:1px 6px;border-radius:6px;font-family:Consolas,monospace;font-size:13px;color:#003bc5}
#solution pre{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.03)}
#solution pre code{background:none;border:0;padding:0;display:block;white-space:pre;color:#1c2333}
#solution blockquote{border-left:3px solid var(--acc);padding:2px 12px;margin:8px 0;color:var(--mut)}
#solution table{border-collapse:collapse;margin:8px 0}
#solution th,#solution td{border:1px solid var(--line);padding:5px 10px;font-size:13px}

/* teacher panel */
.teach-body{flex:1;min-height:0;display:flex;gap:16px;padding:14px}
.avatar-wrap{flex:0 0 205px;min-height:0;min-width:0;position:relative;display:flex;align-items:flex-end;justify-content:center}
.t-box{position:relative;width:200px;height:100%;min-height:0;flex:none;overflow:hidden}
.t-pose{position:absolute;left:50%;bottom:calc(20% + 68px);transform:translateX(-50%) scale(1.5);transform-origin:center bottom;width:72%;object-fit:contain;will-change:transform}
.t-podium{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:80%;height:38%;background:linear-gradient(180deg,#bf8b4a,#8a6238);border-radius:14px 14px 0 0;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.t-podium:before{content:"";position:absolute;left:-8px;right:-8px;top:-12px;height:18px;background:linear-gradient(180deg,#d9a967,#a97a44);border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.t-podium:after{content:"信奥讲堂";position:absolute;left:0;right:0;top:30%;text-align:center;color:rgba(60,40,20,.6);font-family:"Kaiti","STKaiti","Microsoft YaHei",cursive;font-size:20px;letter-spacing:6px;text-shadow:0 1px 1px rgba(255,255,255,.3);pointer-events:none}
.t-podium .leg{position:absolute;bottom:0;width:16px;height:12px;background:#6a4a26;border-radius:0 0 4px 4px}
.t-podium .leg.l{left:24%}.t-podium .leg.r{right:24%}
/* 黑板 (保持绿色板书) */
.transcript{
  flex:1 1 auto;min-width:0;min-height:0;overflow:auto;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(255,255,255,.06), transparent 62%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 22px),
    #274d33;
  border:1px solid rgba(0,0,0,.06);
  border-radius:var(--r2);
  padding:20px 18px;
  font-size:17px;line-height:1.95;
  color:#f4f1e2;
  font-family:"Kaiti","STKaiti","KaiTi","Microsoft YaHei",cursive;
  box-shadow:inset 0 0 40px rgba(0,0,0,.28), 0 4px 12px rgba(0,0,0,.12);
}
.transcript .line{padding:6px 10px;border-radius:10px;cursor:default;transition:background .2s}
.transcript .line.current{color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 -2px 0 #ffd479}
.transcript .line.done{color:#b9c2ab}
.teach-body::after{content:"";grid-column:2;height:8px;margin-top:-6px;border-radius:4px;background:linear-gradient(180deg,#c39a67,#8a6238)}

/* controls */
.controls{display:flex;align-items:center;gap:9px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap;background:rgba(255,255,255,.35)}
.controls .btn{padding:8px 13px}
.rate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.rate select{background:#fff;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:6px 9px}

/* log toast */
.logbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(30,30,36,.85);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:10px 20px;font-size:12px;color:#fff;opacity:0;transition:opacity .2s,transform .3s var(--spring);pointer-events:none;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:50;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.logbar.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.empty{color:var(--mut);font-size:13px;padding:24px;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* progress bar */
.prog{background:rgba(255,255,255,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--line);padding:8px 20px;align-items:center;gap:10px;display:none;position:relative;z-index:4}
.prog.bar{display:flex}
.prog-bar{flex:1;height:8px;background:rgba(0,0,0,.06);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:999px;transition:width .25s;box-shadow:0 0 14px rgba(0,122,255,.4);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.prog-fill.pulse{animation:progPulse 1.2s infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes progPulse{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.prog-text{font-size:12px;color:var(--mut);white-space:nowrap;min-width:150px}

/* 版本升级 */
.udot{color:#FF3B30;font-size:13px;margin-left:4px;cursor:pointer;animation:udot 1.2s infinite}
@keyframes udot{0%,100%{opacity:.4}50%{opacity:1}}
.version{cursor:default}
.umask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.umask[hidden]{display:none}
.udialog{width:380px;max-width:92vw;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);animation:dialogIn .35s var(--spring) both}
@keyframes dialogIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
.uhead{padding:16px 20px;font-size:16px;font-weight:700;letter-spacing:.2px;color:#1D1D1F;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.uhead .x{cursor:pointer;color:var(--mut);font-size:18px;transition:transform .3s var(--spring)}
.uhead .x:hover{transform:rotate(90deg);color:var(--fg)}
.ubody{padding:16px 20px}
.urow{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.urow>span{color:var(--mut);flex:0 0 64px}
.urow>b{color:var(--fg)}
.ulog{margin-top:8px;padding:12px 14px;background:rgba(0,0,0,.05);border:1px solid var(--line);border-radius:14px;font-size:13px;line-height:1.7;color:var(--fg);white-space:pre-wrap;word-break:break-word}
.uprog{display:none;margin:0 18px 12px;height:12px;background:rgba(0,0,0,.06);border-radius:999px;overflow:hidden;position:relative}
.uprog.show{display:block}
.ufill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .2s;border-radius:999px}
.upct{position:absolute;right:6px;top:-1px;font-size:11px;color:var(--fg)}
.ufoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:12px}
.user-area{display:inline-flex;gap:6px;align-items:center}
.user-area .uname{color:#007AFF;font-size:12px;margin-right:2px;font-weight:600}
.flabel{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.finput{width:100%;box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--fg);font-size:14px;transition:border-color .2s,box-shadow .2s}
.finput:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,122,255,.2)}
.ferr{color:#FF3B30;font-size:12px;margin-top:10px;min-height:16px;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="aura"></canvas>
<div class="app">
  <div class="header">
    <h1>张老师随身讲 <small>自主学习讲解</small></h1>
    <button class="btn ghost" id="pickBtn">选择题目文件</button>
    <button class="btn ghost" id="shotBtn">题目截图</button>
    <span class="fname" id="fname">未选择</span>
    <span class="spacer"></span>
    <span class="version">软件版本：<b id="curVer">--</b> <span id="updateDot" class="udot" title="有新版本，点击查看" hidden>●</span></span>
    <button class="btn" id="runBtn" disabled>开始讲解</button>
    <span class="user-area" id="userArea"><button class="btn ghost small" id="regBtn">注册</button><button class="btn ghost small" id="loginBtn">登录</button></span>
  </div>

  <div class="prog" id="prog">
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <span class="prog-text" id="progText">准备…</span>
  </div>

  <div class="main">
    <!-- 左：代码 -->
    <div class="left">
      <div class="panel">
        <div class="panel-head">带注释的参考代码 <span class="tag" id="title1">—</span><span class="fontctl"><button class="mini" id="codeMinus" title="缩小字号">A−</button><button class="mini" id="codePlus" title="放大字号">A+</button></span></div>
        <div class="panel-body"><div id="code" class="coder"><span class="empty">点击「开始讲解」生成带逐行注释的 C++ 代码</span></div></div>
      </div>
    </div>

    <!-- 右：上思路 / 下数字人 -->
    <div class="right">
      <div class="panel">
        <div class="panel-head">解题思路（详细）</div>
        <div class="panel-body"><div id="solution"><span class="empty">讲解时会生成：题意分析、核心算法、复杂度、样例推演、易错点</span></div></div>
      </div>

      <div class="panel">
        <div class="panel-head">张老师随身讲 <span class="tag" id="kpoint"></span></div>
        <div class="teach-body">
          <div class="avatar-wrap" id="avatar"></div>
          <div class="transcript" id="transcript"></div>
        </div>
        <div class="controls">
          <button class="btn ghost" id="prevBtn"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>上一句</button>
          <button class="btn ghost" id="playBtn"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>播放</button>
          <button class="btn ghost" id="pauseBtn"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>暂停</button>
          <button class="btn ghost" id="nextBtn"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>下一句</button>
          <span class="rate">语速
            <select id="rate"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option></select>
          </span>
          <button class="btn ghost" id="dlCodeBtn" disabled>下载代码</button>
          <button class="btn ghost" id="dlDocBtn" disabled>下载讲解</button>
          <button class="btn ghost" id="printBtn" disabled>打印讲解</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="logbar" id="logbar"></div>

<div class="umask" id="updateMask" hidden>
  <div class="udialog">
    <div class="uhead">软件更新 <span class="x" id="uCloseX">✕</span></div>
    <div class="ubody">
      <div class="urow"><span>当前版本</span><b id="uCur">--</b></div>
      <div class="urow"><span>最新版本</span><b id="uNew">--</b></div>
      <div class="urow"><span>更新类型</span><b id="uType">--</b></div>
      <div class="urow" style="align-items:flex-start"><span>更新内容</span><div id="uLog" class="ulog">--</div></div>
    </div>
    <div class="uprog" id="uProg"><div class="ufill" id="uFill"></div><span class="upct" id="uPct">0%</span></div>
    <div class="ufoot">
      <button class="btn ghost" id="uCloseBtn">关闭</button>
      <button class="btn" id="uGoBtn">开始更新</button>
    </div>
  </div>
</div>

<div class="umask" id="regMask" hidden>
  <div class="udialog">
    <div class="uhead">用户注册 <span class="x" id="regX">✕</span></div>
    <div class="ubody">
      <label class="flabel">用户名</label><input id="regUser" class="finput" maxlength="20" placeholder="登录用户名（不可用违规名字）">
      <label class="flabel">手机号</label><input id="regPhone" class="finput" maxlength="11" placeholder="11 位手机号">
      <label class="flabel">登录密码</label><input id="regPass" class="finput" type="password" placeholder="至少 6 位">
      <label class="flabel">确认登录密码</label><input id="regPass2" class="finput" type="password" placeholder="再输入一次密码">
      <div class="ferr" id="regErr"></div>
    </div>
    <div class="ufoot"><button class="btn ghost" id="regCancel">取消</button><button class="btn" id="regGo">注册</button></div>
  </div>
</div>

<div class="umask" id="loginMask" hidden>
  <div class="udialog">
    <div class="uhead">用户登录 <span class="x" id="loginX">✕</span></div>
    <div class="ubody">
      <label class="flabel">用户名 / 手机号</label><input id="loginId" class="finput" placeholder="用户名或手机号">
      <label class="flabel">登录密码</label><input id="loginPass" class="finput" type="password" placeholder="密码">
      <div class="ferr" id="loginErr"></div>
    </div>
    <div class="ufoot"><button class="btn ghost" id="loginCancel">取消</button><button class="btn" id="loginGo">登录</button></div>
  </div>
</div>

<div class="umask" id="infoMask" hidden>
  <div class="udialog">
    <div class="uhead">我的信息 <span class="x" id="infoX">✕</span></div>
    <div class="ubody">
      <div class="urow"><span>用户名</span><b id="infoUser">--</b></div>
      <div class="urow"><span>手机号</span><b id="infoPhone">--</b></div>
      <div class="urow"><span>本月使用</span><b id="infoMonth">--</b></div>
      <div class="urow"><span>累计次数</span><b id="infoCount">--</b></div>
      <div class="ferr" id="infoErr"></div>
    </div>
    <div class="ufoot"><button class="btn ghost" id="infoClose">关闭</button></div>
  </div>
</div>

<script src="motion.js"></script>
