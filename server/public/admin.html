<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>管理后台 · 张老师随身讲</title>
<style>
body{margin:0;background:#f5f5f7;color:#1d1d1f;font:14px "Microsoft YaHei",-apple-system,"PingFang SC",sans-serif;padding:24px}
h1{font-size:20px;margin:0 0 16px;color:#1d1d1f}
h2{font-size:15px;margin:22px 0 8px;color:#007AFF}
.cards{display:flex;gap:16px;flex-wrap:wrap}
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:16px 22px;min-width:150px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.card b{font-size:26px;color:#007AFF;display:block}
.card span{color:#666;font-size:12px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04)}
th,td{border-bottom:1px solid #eee;padding:8px 12px;text-align:left;font-size:13px}
th{background:#fafafa;color:#666;font-weight:600}
tr:hover td{background:#f7faff}
.muted{color:#999}
.cost{color:#c25e00;font-weight:600}
.chart{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04);position:relative}
#ctrend{width:100%;height:230px;display:block}
#ctrend .xlabel{font:500 9px "SF Mono","Microsoft YaHei",monospace;fill:#9aa3b4}
#ctrend .ylab{font:500 11px "Microsoft YaHei",sans-serif;fill:#9aa3b4}
#ctrend .dot{cursor:pointer;transition:r .15s}
#ctrend .dot:hover{r:4.5;fill:#0044cc}
.chart .tip{position:absolute;pointer-events:none;background:rgba(28,28,30,.9);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .15s;z-index:5}
.chart .tip b{color:#7cc4ff}
</style>
</head>
<body>
<h1>管理后台 · 张老师随身讲</h1>
<div class="cards">
  <div class="card"><b id="uCount">0</b><span>注册用户数</span></div>
  <div class="card"><b id="gCount">0</b><span>使用记录数</span></div>
  <div class="card"><b id="totalCost">¥0.00</b><span>所有用户总费用</span></div>
</div>

<h2>费用走势（每 5 分钟 · 自当日06:00起 · 累计总消耗）</h2>
<div class="chart">
  <svg id="ctrend"></svg>
  <div class="tip" id="tip"></div>
</div>

<h2>用户列表（用户名 / 手机号 / 累计次数 / 累计费用 / 注册时间）</h2>
<table><thead><tr><th>用户名</th><th>手机号</th><th>累计次数</th><th>累计费用</th><th>注册时间</th></tr></thead><tbody id="users"></tbody></table>

<h2>使用记录（每次：IP / 城市 / 用户名 / 手机号 / 时间 / 累计次数 / 费用）</h2>
<table><thead><tr><th>IP</th><th>城市</th><th>用户名</th><th>手机号</th><th>使用时间</th><th>累计次数</th><th>费用</th></tr></thead><tbody id="usage"></tbody></table>

<script>
async function j(u){ const r=await fetch(u); return r.json(); }
function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(v){ return '¥' + (Number(v)||0).toFixed(4); }
function fmtT(iso){ const d=new Date(iso); return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); }
function fmtNum(v){ if(v>=1000) return (v/1000).toFixed(1)+'k'; if(v>=10) return v.toFixed(0); return (+v.toFixed(2))+''; }
// 美观刻度：取 1/2/5×10^n 的步长，让 Y 轴为整数
function niceTicks(max){
  const rough=max/5 || 1;
  const mag=Math.pow(10, Math.floor(Math.log10(rough)));
  const norm=rough/mag; let step;
  if(norm<1.5) step=1; else if(norm<3) step=2; else if(norm<7) step=5; else step=10;
  step*=mag;
  const top=Math.ceil(max/step)*step;
  const ticks=[]; for(let v=0; v<=top+1e-6; v+=step) ticks.push(+v.toFixed(4));
  return {ticks, top};
}

let ctxData=[];
function renderChart(points){
  const svg=document.getElementById('ctrend');
  const W=Math.max(720, svg.clientWidth||720);
  const H=Math.max(210, Math.min(340, Math.round(W*0.28)));   // 自适应高度(约宽度28%, 210-340)
  const L=54, R=18, T=18, B=78;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if(!points||!points.length){ svg.innerHTML='<text x="'+(W/2)+'" y="'+(H/2)+'" fill="#999" text-anchor="middle">暂无数据</text>'; return; }
  ctxData=points;
  const plotW=W-L-R, plotH=H-T-B;
  const minT=Math.min(...points.map(p=>p.tTime)), maxT=Math.max(...points.map(p=>p.tTime));
  const maxC=Math.max(...points.map(p=>p.cost),0.0001);
  const n=niceTicks(maxC); const top=n.top;
  const X=(t)=>L+((t-minT)/(Math.max(1,maxT-minT)))*plotW;
  const Y=(c)=>H-B-(c/top)*plotH;
  let s='';
  // 渐变定义：面积纵向渐隐 + 曲线横向蓝→靛
  s+='<defs><linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(0,122,255,.28)"/><stop offset="1" stop-color="rgba(0,122,255,0)"/></linearGradient>'
    +'<linearGradient id="lineG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#007AFF"/><stop offset="1" stop-color="#5E5CE6"/></linearGradient></defs>';
  // Y 网格 + 美观刻度
  for(const c of n.ticks){ const y=Math.round(Y(c)); s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#eef0f4" stroke-width="1"/>'; s+='<text class="ylab" x="'+(L-10)+'" y="'+(y+4)+'" text-anchor="end">'+fmtNum(c)+'</text>'; }
  // X 轴：每 5 分钟一个旋转标签
  for(const p of points){ const x=Math.round(X(p.tTime)); s+='<g transform="translate('+x+','+(H-B)+')"><line x1="0" y1="0" x2="0" y2="4" stroke="#d5dae2"/><text class="xlabel" transform="rotate(-45)" x="4" y="13" text-anchor="end">'+esc(fmtT(p.tLabel))+'</text></g>'; }
  // 曲线 + 渐变面积 + 节点
  const pts=points.map(p=>X(p.tTime)+','+Y(p.cost)).join(' ');
  s+='<polygon data-area points="'+X(points[0].tTime)+','+(H-B)+' '+pts+' '+X(points[points.length-1].tTime)+','+(H-B)+'" fill="url(#areaG)"/>';
  s+='<polyline data-line points="'+pts+'" fill="none" stroke="url(#lineG)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  points.forEach((p,i)=>{ s+='<circle class="dot" cx="'+X(p.tTime)+'" cy="'+Y(p.cost)+'" r="2.6" fill="#fff" stroke="#007AFF" stroke-width="1.8" data-i="'+i+'"/>'; });
  s+='<text class="ylab" x="'+L+'" y="14">费用(元)</text>';
  svg.innerHTML=s;
  // 入场描线动画（reactbits 风格）
  const line=svg.querySelector('polyline[data-line]');
  if(line){ const len=(line.getTotalLength&&line.getTotalLength())||4000; line.style.strokeDasharray=len; line.style.strokeDashoffset=len; line.getBoundingClientRect(); line.style.transition='stroke-dashoffset 1.1s ease'; line.style.strokeDashoffset='0'; }
}
// 自适应高度：窗口变化时重绘
let _resizeT=null;
window.addEventListener('resize', function(){ clearTimeout(_resizeT); _resizeT=setTimeout(function(){ if(ctxData.length) renderChart(ctxData); }, 150); });
// 悬停 tooltip
document.addEventListener('mousemove', function(e){
  const svg=document.getElementById('ctrend'); const tip=document.getElementById('tip');
  if(!svg||!tip||!ctxData.length) return;
  const r=svg.getBoundingClientRect(); const x=e.clientX-r.left;
  if(e.target.closest && !e.target.closest('#ctrend')){ tip.style.opacity=0; return; }
  const rr=(x)/(r.width); const idx=Math.round(rr*(ctxData.length-1)); const p=ctxData[Math.min(Math.max(idx,0),ctxData.length-1)];
  tip.style.left=e.clientX-r.left+'px'; tip.style.top=(e.clientY-r.top)+'px';
  tip.innerHTML='<b>'+fmtT(p.tLabel)+'</b> 累计 ¥'+p.cost.toFixed(2);
  tip.style.opacity=1;
});
async function load(){
  const s=await j('api/admin/stats');
  document.getElementById('uCount').textContent=s.userCount||0;
  document.getElementById('gCount').textContent=s.usageCount||0;
  document.getElementById('totalCost').textContent=money(s.totalCost);
  const users=await j('api/admin/users');
  document.getElementById('users').innerHTML=users.map(u=>'<tr><td>'+esc(u.username)+'</td><td>'+esc(u.phone)+'</td><td>'+u.count+'</td><td class="cost">'+money(u.cost)+'</td><td class="muted">'+esc(u.createdAt||'')+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">暂无用户</td></tr>';
  const usage=await j('api/admin/usage');
  document.getElementById('usage').innerHTML=usage.slice().reverse().map(u=>'<tr><td>'+esc(u.ip)+'</td><td>'+esc(u.city)+'</td><td>'+esc(u.username)+'</td><td>'+esc(u.phone)+'</td><td class="muted">'+esc(u.time)+'</td><td>'+u.count+'</td><td class="cost">'+money(u.cost)+'</td></tr>').join('')||'<tr><td colspan="7" class="muted">暂无记录</td></tr>';
  const trend=await j('api/admin/costtrend');
  renderChart(trend.map(x=>({tTime:Date.parse(x.t), tLabel:x.t, cost:x.cost})));
}
load();
setInterval(load, 180000);   // 3 分钟自动刷新
</script>
</body>
</html>
